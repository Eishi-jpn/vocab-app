    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
            margin-top: 50px;
        }
        p {
            color: #555;
            font-size: 1.2em;
        }
        .form-container {
            margin-top: 30px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 1.2em;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2em;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-size: 1.5em;
            color: #333;
        }
    </style>

<body>
    <h1>英単語演習</h1>
	
	<form action="/select" method="post">
		<div  class="selectbox">
			<label for="chapter">問題の章</label>
			<select id="chapter" name="chapter">
				<option value="Chapter1">Chapter1</option>
				<option value="Chapter2">Chapter2</option>
				<option value="Chapter3">Chapter3</option>
			</select>
		</div>
		<br>
		<div  class="selectbox">
			<label for="part">品詞選択</label>
			<select id="part" name="part">
				<option value="nouns">名詞</option>
				<option value="verb">動詞</option>
				<option value="ads">形容詞・副詞</option>
			</select>
		</div>
		<br>
		<div class="selectbox">
			<label for="direction">問題形式</label>
			<select id="direction" name="direction">
				<option value="e-to-j">英 -> 日</option>
				<option value="j-to-e">日 -> 英</option>
			</select>
		</div>
		<br>
		<div class="selectbox">
			<label for="size">問題の数</label>
			<select id="size" name="size">
				<option value="10">10問</option>
				<option value="20">20問</option>
				<option value="30">30問</option>
				<option value="40">40問</option>
				<option value="50">50問</option>
			</select>
		</div>

		<br>
		<br>
		<div class="submit_button">
			<button type="submit">問題を解き始める</button>			
		</div>
	</form>
