<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="/css/style.css">
    <title>テスト結果</title>
</head>
<body>
    <h1 style="text-align: center;">テスト結果</h1>
    <ul>
		<div class="result-container">
			<form action="/top" method="post">
				<div th:each="result : ${resultList}" class="result-item" th:classappend="${result.judge} ? 'correct' : 'incorrect'">
					<h3 th:text="${result.question}"></h3>
					<p th:text="'あなたの答え : ' + ${result.answer}"></p>
					<p th:text="${result.judge} ? '正解' : '不正解'"></p>
					<p th:unless="${result.judge}" th:text="'正解は ' + ${result.correctAnswer} + ' です'"></p>
				</div>

				<div class="result-summary">
					<p th:text="'正解率 : ' + ${correct} + '/' + ${size} + '　　　　　' + ${rate} + ' %'"></p>
				</div>

				<div class="submit_button">
					<button>topページへ戻る</button>
				</div>
			</form>
		</div>
    </ul>
</body>
</html>
